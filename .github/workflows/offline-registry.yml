name: BTS offline registry acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Test isolated registry and public intake provenance
        run: python3 -B tests/offline_public_intake.py -q
      - name: Check BTS object-key segment safety and derived prefixes
        run: python3 -B tests/offline_object_key_safety.py -q
      - name: Check BTS worker lease and deferral deadline validation
        run: python3 -B tests/offline_worker_timing.py -q
